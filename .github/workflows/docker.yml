name: Docker CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACR_NAME: plantjournaldaac2bd8
  ACR_LOGIN_SERVER: plantjournaldaac2bd8.azurecr.io
  IMAGE_NAME: plant-journal

jobs:
  build:
    name: Build and test Linux image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile runs cargo test --locked before building the release binary.
      - name: Build and test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: plant-journal:ci
          cache-from: type=gha,scope=plant-journal-linux-amd64
          cache-to: type=gha,mode=max,scope=plant-journal-linux-amd64

      - name: Smoke-test runtime image
        run: docker run --rm --network none plant-journal:ci --version

      - name: Export tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save plant-journal:ci | gzip > "$RUNNER_TEMP/plant-journal.tar.gz"

      - name: Upload tested image for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plant-journal-image
          path: ${{ runner.temp }}/plant-journal.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish tested image to Azure Container Registry
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: acr-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Azure identity configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          for setting in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set $setting in GitHub Actions secrets; see docs/github-actions.md."
              exit 1
            fi
          done

      - name: Download tested image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plant-journal-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: gzip -dc "$RUNNER_TEMP/plant-journal.tar.gz" | docker load

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to registry
        run: az acr login --name "$ACR_NAME" --only-show-errors

      - name: Push commit image
        run: |
          image="$ACR_LOGIN_SERVER/$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag plant-journal:ci "$image"
          docker push "$image"
          printf 'Published image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of registry
        if: always()
        run: docker logout "$ACR_LOGIN_SERVER"

  deploy:
    name: Deploy tested image to App Service
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep the branch-based OIDC identity created by App Service. The registry
      # publisher uses a separate identity scoped to the acr-publish environment.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40500D3F48384586A0E1AE58B856CADC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FF9DE6EB6F2E48DBB09B5094B885D277 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F7417CEAF7F64E98BABD5F24A1EB0D94 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: plant-journal
          slot-name: Production
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
